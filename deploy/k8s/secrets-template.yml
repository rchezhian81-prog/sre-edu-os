# Copy to secrets.yml, fill values, apply: kubectl apply -f secrets.yml
# DO NOT COMMIT secrets.yml to git!
apiVersion: v1
kind: Secret
metadata:
  name: sre-secrets
  namespace: sre-edu-os
type: Opaque
stringData:
  DB_HOST: "your-rds-endpoint.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_USER: "sre_admin"
  DB_PASS: "your_strong_password"
  DB_NAME: "sre_edu_os"
  DB_SSL: "true"
  JWT_SECRET: "your_64_char_minimum_secret"
  JWT_REFRESH_SECRET: "your_64_char_minimum_refresh_secret"
  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  NODE_ENV: "production"
  REDIS_HOST: "your-redis.cache.amazonaws.com"
  REDIS_PORT: "6379"
  AWS_REGION: "ap-south-1"
  AWS_ACCESS_KEY_ID: "AKIA..."
  AWS_SECRET_ACCESS_KEY: "your_secret"
  AWS_S3_BUCKET: "sre-edu-os-uploads"
  SMTP_HOST: "email-smtp.ap-south-1.amazonaws.com"
  SMTP_PORT: "587"
  SMTP_USER: "your_smtp_user"
  SMTP_PASS: "your_smtp_pass"
  SMTP_FROM: "noreply@sreedos.com"
  WA_PHONE_ID: "your_phone_id"
  WA_ACCESS_TOKEN: "your_wa_token"
  OPENAI_API_KEY: "sk-..."
  RAZORPAY_KEY_ID: "rzp_live_..."
 