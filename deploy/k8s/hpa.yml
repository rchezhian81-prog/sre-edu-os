apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sre-backend-hpa
  namespace: sre-edu-os
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sre-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
