name: SRE EDU OS — Build & Deploy

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REPO_BACKEND:  ${{ secrets.ECR_REPO_BACKEND }}
  ECR_REPO_FRONTEND: ${{ secrets.ECR_REPO_FRONTEND }}

jobs:
  # ── 1. Test & Lint ────────────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sre_edu_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: backend/package-lock.json }
      - run: cd backend && npm ci
      - run: cd backend && npm run lint
      - run: cd backend && npm run type-check || true
      - name: Run unit tests
        run: cd backend && npm test -- --passWithNoTests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: sre_edu_test
          JWT_SECRET: ci_test_secret_minimum_64_chars_long_do_not_use_in_production
          JWT_REFRESH_SECRET: ci_refresh_secret_minimum_64_chars_long_do_not_use
          NODE_ENV: test

  # ── 2. Build & Push Docker Images ────────────────────────────────────────
  build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    outputs:
      backend_tag:  ${{ steps.meta.outputs.backend_tag }}
      frontend_tag: ${{ steps.meta.outputs.frontend_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: meta
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          echo "backend_tag=${{ steps.ecr.outputs.registry }}/$ECR_REPO_BACKEND:$SHA"  >> $GITHUB_OUTPUT
          echo "frontend_tag=${{ steps.ecr.outputs.registry }}/$ECR_REPO_FRONTEND:$SHA" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.backend_tag }}
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.frontend_tag }}
          build-args: NEXT_PUBLIC_API_URL=${{ secrets.API_URL }}
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,mode=max,scope=frontend

  # ── 3. Deploy to Kubernetes ───────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    needs: build
    runs-on: ubuntu-22.04
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name sre-edu-os-cluster --region ${{ env.AWS_REGION }}

      - name: Deploy backend
        run: |
          kubectl set image deployment/sre-backend api=${{ needs.build.outputs.backend_tag }} -n sre-edu-os
          kubectl rollout status deployment/sre-backend -n sre-edu-os --timeout=5m

      - name: Deploy frontend
        run: |
          kubectl set image deployment/sre-frontend web=${{ needs.build.outputs.frontend_tag }} -n sre-edu-os
          kubectl rollout status deployment/sre-frontend -n sre-edu-os --timeout=5m

      - name: Run post-deploy smoke test
        run: |
          sleep 10
          curl -f ${{ secrets.API_URL }}/health || exit 1
          echo "Smoke test passed."
