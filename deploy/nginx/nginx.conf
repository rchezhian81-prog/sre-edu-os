# SRE EDU OS — Production Nginx Configuration
# Place at /etc/nginx/sites-available/sreedos.com

upstream api_backend {
    server sre-backend-svc:3000;
    keepalive 64;
}
upstream web_frontend {
    server sre-frontend-svc:4000;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name api.sreedos.com app.sreedos.com;
    return 301 https://$host$request_uri;
}

# API Server
server {
    listen 443 ssl http2;
    server_name api.sreedos.com;

    ssl_certificate     /etc/letsencrypt/live/api.sreedos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sreedos.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    client_max_body_size 50M;

    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}

# Frontend Server
server {
    listen 443 ssl http2;
    server_name app.sreedos.com;

    ssl_certificate     /etc/letsencrypt/live/app.sreedos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.sreedos.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /_next/static/ {
        proxy_pass http://web_frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        proxy_pass http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
